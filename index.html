<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Name Card Scanner</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 18px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .user-badge {
      font-size: 0.85rem;
      color: var(--accent);
      word-break: break-all;
    }
    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 78px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .camera-box {
      margin-top: 8px;
    }
    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font-size: 0.88rem;
    }
    #preview {
      display: none;
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid var(--border);
      background: #020617;
    }
    .ocr-bar {
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--accent);
      min-height: 18px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      font-size: 0.9rem;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #082f49;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      width: auto;
      margin-top: 0;
      padding: 6px 12px;
      font-size: 0.8rem;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    #status {
      margin-top: 12px;
      font-size: 0.88rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .ok { color: var(--success); }
    .err { color: var(--error); }
    #appSection { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Name Card Scanner</h1>
    <div class="subtitle">Capture card photos to Google Drive, auto-fill details with OCR, log to Google Sheets, and optionally sync to Pipedrive.</div>

    <div class="panel" id="authSection">
      <div id="g_id_signin"></div>
      <div id="authMessage" class="subtitle" style="margin: 10px 0 0;">Sign in with an authorized Google account to continue.</div>
    </div>

    <div id="appSection">
      <div class="panel row">
        <div class="user-badge" id="userEmailDisplay"></div>
        <button type="button" class="btn-secondary" id="signOutBtn">Sign out</button>
      </div>

      <form class="panel" id="cardForm">
        <div class="camera-box">
          <label for="cardPhoto">Business Card Photo (Camera or Gallery)</label>
          <input type="file" id="cardPhoto" accept="image/*" capture="environment" required />
          <img id="preview" alt="Card preview" />
          <div class="ocr-bar" id="ocrStatus"></div>
        </div>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Jane Tan" />

        <label for="jobTitle">Job Title</label>
        <input type="text" id="jobTitle" placeholder="e.g. Director, Corporate Real Estate" />

        <label for="company">Company</label>
        <input type="text" id="company" placeholder="e.g. Acme Holdings Bhd" />

        <label for="phone">Phone</label>
        <input type="tel" id="phone" placeholder="e.g. +60 12-345 6789" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="e.g. jane@acme.com.my" />

        <label for="website">Website</label>
        <input type="url" id="website" placeholder="e.g. https://acme.com.my" />

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="e.g. Kuala Lumpur / Petaling Jaya" />

        <label for="rawOcrText">Raw Scanned Text (Reference Only)</label>
        <textarea id="rawOcrText" placeholder="Scanned card text will appear here for quick checking..." readonly></textarea>

        <label class="checkbox-row">
          <input type="checkbox" id="syncPipedrive" />
          <span>Sync contact &amp; note to Pipedrive</span>
        </label>

        <button type="submit" id="submitBtn">Save Name Card</button>
        <div id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '89809158897-0k2ri8oi2963b2vqudiv8noo19gqvqug.apps.googleusercontent.com';
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAsI5OP8-64BJgcl6o9ZDpxQQ_xXW0aISYhAiSeTJsaXRHmB8_MfevcNtpChQf8CcF/exec';

    let currentUserEmail = '';
    let selectedFileBase64 = '';
    let selectedFileMime = 'image/jpeg';

    function decodeJwtPayload(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
      return JSON.parse(jsonPayload);
    }

    async function handleCredentialResponse(response) {
      const authMsg = document.getElementById('authMessage');
      authMsg.textContent = 'Verifying authorized user...';
      try {
        const payload = decodeJwtPayload(response.credential);
        const email = (payload.email || '').toLowerCase();

        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'checkUser', userEmail: email })
        });
        const data = await res.json();

        if (!data.ok || !data.authorized) {
          authMsg.innerHTML = `<span class="err">${data.error || 'Access denied for ' + email}</span>`;
          return;
        }

        currentUserEmail = email;
        document.getElementById('userEmailDisplay').textContent = 'Signed in: ' + currentUserEmail;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('appSection').style.display = 'block';
      } catch (err) {
        authMsg.innerHTML = `<span class="err">Sign-in check failed: ${err.message}</span>`;
      }
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(document.getElementById('g_id_signin'), {
        theme: 'outline',
        size: 'large',
        width: 300
      });
    };

    document.getElementById('signOutBtn').addEventListener('click', () => {
      currentUserEmail = '';
      document.getElementById('appSection').style.display = 'none';
      document.getElementById('authSection').style.display = 'block';
      document.getElementById('authMessage').textContent = 'Signed out.';
    });

    function compressImage(file, maxWidth = 1400, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function parseCardText(rawText) {
      const lines = rawText
        .split(/\r?\n/)
        .map((l) => l.replace(/\s+/g, ' ').trim())
        .filter((l) => l.length > 1);

      const emailMatch = rawText.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
      const email = emailMatch ? emailMatch[0].toLowerCase() : '';

      const urlMatch = rawText.match(/(?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)+[^\s]*/i);
      let website = '';
      if (urlMatch) {
        const candidate = urlMatch[0].replace(/[),.;]+$/, '');
        if (!candidate.includes('@')) {
          website = /^https?:\/\//i.test(candidate) ? candidate : 'https://' + candidate;
        }
      }

      const phoneMatches = rawText.match(/(?:\+?\d[\d\s\-().]{6,}\d)/g) || [];
      const phone = phoneMatches
        .map((p) => p.trim())
        .sort((a, b) => b.replace(/\D/g, '').length - a.replace(/\D/g, '').length)[0] || '';

      const titleKeywords = /\b(director|manager|executive|ceo|coo|cfo|md|managing|partner|consultant|advisor|agent|negotiator|head|lead|president|vp|vice president|officer|engineer|architect|analyst|specialist|associate)\b/i;
      const companyKeywords = /\b(sdn\.?\s*bhd|bhd|berhad|pte\.?\s*ltd|ltd|inc\.?|corp\.?|company|co\.?|group|holdings|properties|realty|estate|enterprise|ventures|associates|partners)\b/i;
      const addressKeywords = /\b(jalan|jln|lorong|persiaran|taman|bandar|menara|wisma|plaza|suite|level|floor|lot|no\.?|kuala lumpur|petaling jaya|selangor|cyberjaya|putrajaya|penang|johor|malaysia|\d{5})\b/i;

      const remaining = lines.filter((line) => {
        if (email && line.toLowerCase().includes(email)) return false;
        if (website && line.toLowerCase().includes(website.replace(/^https?:\/\//i, '').toLowerCase())) return false;
        const digitCount = (line.match(/\d/g) || []).length;
        if (digitCount >= 7 && !addressKeywords.test(line)) return false;
        return true;
      });

      const company = remaining.find((l) => companyKeywords.test(l)) || '';
      const jobTitle = remaining.find((l) => l !== company && titleKeywords.test(l)) || '';
      const addressLines = remaining.filter((l) => l !== company && l !== jobTitle && addressKeywords.test(l));
      const address = addressLines.join(', ');

      const fullName = remaining.find((l) => {
        if (l === company || l === jobTitle || addressLines.includes(l)) return false;
        const words = l.split(/\s+/);
        const hasDigits = /\d/.test(l);
        return !hasDigits && words.length >= 2 && words.length <= 5;
      }) || '';

      return { fullName, jobTitle, company, phone, email, website, address };
    }

    async function runOcr(imageDataUrl) {
      const ocrStatus = document.getElementById('ocrStatus');
      const rawBox = document.getElementById('rawOcrText');
      if (!window.Tesseract) {
        ocrStatus.textContent = 'OCR library not loaded—fill fields manually.';
        return;
      }

      ocrStatus.textContent = 'Scanning text from card (0%)...';
      try {
        const result = await Tesseract.recognize(imageDataUrl, 'eng', {
          logger: (m) => {
            if (m.status === 'recognizing text' && typeof m.progress === 'number') {
              ocrStatus.textContent = `Scanning text from card (${Math.round(m.progress * 100)}%)...`;
            }
          }
        });

        const text = (result.data && result.data.text) || '';
        rawBox.value = text.trim();

        const parsed = parseCardText(text);
        if (parsed.fullName) document.getElementById('fullName').value = parsed.fullName;
        if (parsed.jobTitle) document.getElementById('jobTitle').value = parsed.jobTitle;
        if (parsed.company) document.getElementById('company').value = parsed.company;
        if (parsed.phone) document.getElementById('phone').value = parsed.phone;
        if (parsed.email) document.getElementById('email').value = parsed.email;
        if (parsed.website) document.getElementById('website').value = parsed.website;
        if (parsed.address) document.getElementById('address').value = parsed.address;

        ocrStatus.textContent = 'Auto-fill complete — please review fields before saving.';
      } catch (err) {
        ocrStatus.textContent = 'Could not read text automatically — fill fields manually.';
      }
    }

    document.getElementById('cardPhoto').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      const preview = document.getElementById('preview');
      const submitBtn = document.getElementById('submitBtn');
      if (!file) {
        selectedFileBase64 = '';
        preview.style.display = 'none';
        document.getElementById('ocrStatus').textContent = '';
        return;
      }

      submitBtn.disabled = true;
      selectedFileBase64 = await compressImage(file);
      selectedFileMime = 'image/jpeg';
      preview.src = selectedFileBase64;
      preview.style.display = 'block';

      await runOcr(selectedFileBase64);
      submitBtn.disabled = false;
    });

    document.getElementById('cardForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      if (!selectedFileBase64) {
        statusEl.innerHTML = '<span class="err">Please select or take a photo of the name card first.</span>';
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = 'Uploading photo & saving record...';

      const payload = {
        action: 'saveCard',
        userEmail: currentUserEmail,
        syncPipedrive: document.getElementById('syncPipedrive').checked,
        card: {
          fullName: document.getElementById('fullName').value.trim(),
          jobTitle: document.getElementById('jobTitle').value.trim(),
          company: document.getElementById('company').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          email: document.getElementById('email').value.trim(),
          website: document.getElementById('website').value.trim(),
          address: document.getElementById('address').value.trim(),
          imageBase64: selectedFileBase64,
          mimeType: selectedFileMime
        }
      };

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (!data.ok) {
          statusEl.innerHTML = `<span class="err">Error: ${data.error}</span>`;
        } else {
          statusEl.innerHTML =
            `<span class="ok">Saved to Google Sheets & Drive!</span>\n` +
            `Pipedrive: ${data.pipedriveStatus}\n` +
            `Photo: ${data.photoUrl}`;
          e.target.reset();
          selectedFileBase64 = '';
          document.getElementById('preview').style.display = 'none';
          document.getElementById('ocrStatus').textContent = '';
          document.getElementById('rawOcrText').value = '';
        }
      } catch (err) {
        statusEl.innerHTML = `<span class="err">Request failed: ${err.message}</span>`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
